name: CI

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          enable-cache: true
          # Pin to 3.13: spacy 3.8.x has no cp314 wheels, so uv must not
          # auto-select the newer 3.14 interpreter. Matches .python-version.
          python-version: "3.13"

      - name: Install dev tools (ruff)
        run: uv sync --frozen --only-group dev --no-install-project

      - name: Run ruff
        run: uv run ruff check . && uv run ruff format --check .

  # Frontend install once, then biome / tsc / vitest in parallel.
  # Add this job as a required status check if branch protection still only lists `lint`.
  frontend:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Match packageManager in frontend/package.json for cache stability.
          bun-version: "1.3.5"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check, typecheck, guardrails, and test
        run: |
          set -euo pipefail
          mkdir -p /tmp/fe-ci
          # set +e per subshell: inherited -e kills the subshell before it can
          # record the exit code, so a failing check loses its own log group.
          (set +e; bun run check > /tmp/fe-ci/check.log 2>&1; echo $? > /tmp/fe-ci/check.exit) &
          (set +e; bun run typecheck > /tmp/fe-ci/typecheck.log 2>&1; echo $? > /tmp/fe-ci/typecheck.exit) &
          (set +e; bun run check:all > /tmp/fe-ci/guardrails.log 2>&1; echo $? > /tmp/fe-ci/guardrails.exit) &
          (set +e; bun run test > /tmp/fe-ci/test.log 2>&1; echo $? > /tmp/fe-ci/test.exit) &
          wait
          status=0
          for name in check typecheck guardrails test; do
            code=$(cat /tmp/fe-ci/$name.exit 2>/dev/null || echo 1)
            echo "::group::$name (exit $code)"
            cat /tmp/fe-ci/$name.log 2>/dev/null || echo "(no log — $name never started)"
            echo "::endgroup::"
            if [ "$code" != "0" ]; then status=1; fi
          done
          exit $status

  # Migration graph on the PR's merge commit. pytest runs --nomigrations, so a
  # branch that predates main's newest migration passes `test` and only forks
  # the graph at deploy. Skips itself unless models or migrations changed.
  migrations:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Both parents of the merge commit: HEAD^1 is the base tip it was built on.
          fetch-depth: 2

      - name: Detect model or migration changes
        id: changed
        run: |
          if git diff --quiet HEAD^1 HEAD -- overbae/models overbae/migrations; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No changes under overbae/models or overbae/migrations — nothing to check."
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.changed.outputs.relevant == 'true'
        with:
          version: "0.11.0"
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        if: steps.changed.outputs.relevant == 'true'
        run: uv sync --frozen --group test

      - name: Check migrations
        if: steps.changed.outputs.relevant == 'true'
        run: |
          touch .env
          make check-migrations MIGRATIONS_BASE=HEAD^1

  test:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          enable-cache: true
          # Pin to 3.13: spacy 3.8.x has no cp314 wheels, so uv must not
          # auto-select the newer 3.14 interpreter. Matches .python-version.
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Create .env file
        run: touch .env

      - name: Run tests
        # Match local `make test`: xdist is already in the test dep group.
        run: uv run pytest tests/ -n auto --dist worksteal -q
