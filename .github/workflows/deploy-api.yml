name: Deploy API

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build the immutable image for a controlled rollout without deploying services
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "overbae/**"
      - "docker/**"
      - "scripts/deploy_ecs.py"
      - "pyproject.toml"
      - "manage.py"
      - ".github/workflows/deploy-api.yml"
  release:
    types: [published]

concurrency:
  # Staging (main) and prod (published release) must not block each other.
  group: deploy-api-${{ github.event_name == 'release' && 'prod' || 'staging' }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  # Not secrets — OIDC controls who can assume these roles (see cloud/github_oidc.tf).
  # Build always pushes to the shared prod ECR repo, so it always uses the prod role;
  # deploys use the role scoped to the target environment's cluster.
  AWS_BUILD_ROLE_ARN: arn:aws:iam::318651457362:role/overmind-prod-github-deploy
  AWS_DEPLOY_ROLE_ARN: ${{ github.event_name == 'release' && 'arn:aws:iam::318651457362:role/overmind-prod-github-deploy' || 'arn:aws:iam::318651457362:role/overmind-staging-github-deploy' }}
  ECR_REPOSITORY: overmind-prod-app
  # main / workflow_dispatch → staging; published release → production
  ECS_CLUSTER: ${{ github.event_name == 'release' && 'overmind-prod-cluster' || 'overmind-staging-cluster' }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image-uri.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}-build

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ECR repo is immutable: never reuse a tag. main uses sha-…; published
      # releases use the release tag so a later prod cut of the same commit can still push.
      - name: Set image tag
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Compose image URI
        id: image-uri
        run: echo "uri=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          tags: ${{ steps.image-uri.outputs.uri }}
          labels: |
            org.opencontainers.image.title=Overmind API
            org.opencontainers.image.description=Overmind production API and background workers
            org.opencontainers.image.vendor=Overmind Platform
          context: .
          push: true
          # Avoid extra untagged manifest rows in ECR from attestations
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every service this release needs must already exist: cloud-platform provisions
  # them. Nothing deploys otherwise, so a new lane cannot receive work before it
  # has a consumer.
  preflight:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.lanes.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}-preflight
      - name: Refuse unless every service is provisioned
        run: python scripts/deploy_ecs.py preflight
      - id: lanes
        run: echo "services=$(python scripts/deploy_ecs.py lanes)" >> "$GITHUB_OUTPUT"

  # Compatible schema changes land before any new code runs.
  migrate:
    runs-on: ubuntu-latest
    needs: [build-and-push, preflight]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}-migrate
      - name: Migrate without starting the API
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: python scripts/deploy_ecs.py migrate

  # Consumers first. A busy worker keeps its task protected and drains, so a lane
  # rollout lasts as long as its longest in-flight task.
  deploy-workers:
    runs-on: ubuntu-latest
    needs: [build-and-push, preflight, migrate]
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.preflight.outputs.lanes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}-${{ matrix.service }}
      - name: Deploy immutable image
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          SERVICE: ${{ matrix.service }}
        run: python scripts/deploy_ecs.py deploy

  # Beat must not schedule new tasks onto workers that cannot register them.
  deploy-beat:
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-workers]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}-beat
      - name: Deploy scheduler after workers
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          SERVICE: celery-beat
        run: python scripts/deploy_ecs.py deploy

  deploy-api:
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-beat]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}-api
      - name: Deploy API after consumers and scheduler
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          SERVICE: api
        run: python scripts/deploy_ecs.py deploy
