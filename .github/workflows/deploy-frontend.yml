name: Deploy Frontend
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  release:
    types: [published]
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]
    paths-ignore:
      - "*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy-frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # main / pull_request → staging; published release → production.
      # Vite loads frontend/.env.<mode> for the build, so the committed env
      # files are the one source of each target's public config.
      - name: Select target
        id: target
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            echo "mode=production" >> "$GITHUB_OUTPUT"
            echo "pages_project=console-overmind" >> "$GITHUB_OUTPUT"
            echo "pages_branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "mode=staging" >> "$GITHUB_OUTPUT"
            echo "pages_project=console-overmind-staging" >> "$GITHUB_OUTPUT"
            echo "pages_branch=" >> "$GITHUB_OUTPUT"
          fi

      - run: bun install --frozen-lockfile
      - run: bun run build --mode ${{ steps.target.outputs.mode }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: 061081d3722064fa8f3bd5340b55eb7a
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: ${{ steps.target.outputs.pages_project }}
          PAGES_BRANCH: ${{ steps.target.outputs.pages_branch }}
        run: |
          bun run wrangler pages deploy dist --project-name="$PAGES_PROJECT" ${PAGES_BRANCH:+--branch="$PAGES_BRANCH"}
