name: Deploy Frontend
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  release:
    types: [published]
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]
    paths-ignore:
      - "*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy-frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Write .env from the environment's CONSOLE_ENV variable
        run: printf '%s\n' "$CONSOLE_ENV" > .env
        env:
          CONSOLE_ENV: ${{ vars.CONSOLE_ENV }}

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: 061081d3722064fa8f3bd5340b55eb7a
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            bun run wrangler pages deploy dist --project-name=console-overmind --branch=main
          else
            bun run wrangler pages deploy dist --project-name=console-overmind-staging
          fi
