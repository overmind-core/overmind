name: SDK CI

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - "overmind/**"
      - ".github/workflows/sdk-ci.yml"
  push:
    branches: [main]
    paths:
      - "overmind/**"
      - ".github/workflows/sdk-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overmind
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          enable-cache: true
          python-version: "3.13"

      - run: uv sync --frozen --extra tracing --group dev
      - run: make lint-check
      - run: make test

  version-bump:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install packaging

      - name: Require overmind/pyproject.toml version above ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          git show "origin/$GITHUB_BASE_REF:overmind/pyproject.toml" > base-pyproject.toml
          python3 - <<'EOF'
          import sys, tomllib
          from packaging.version import Version
          base = Version(tomllib.load(open("base-pyproject.toml", "rb"))["project"]["version"])
          head = Version(tomllib.load(open("overmind/pyproject.toml", "rb"))["project"]["version"])
          print(f"base {base} -> head {head}")
          sys.exit(0 if head > base else "SDK version must be bumped above the base branch.")
          EOF
