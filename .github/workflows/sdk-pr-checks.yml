name: SDK Pull Request Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "overmind/**"
      - ".github/workflows/sdk-pr-checks.yml"

permissions:
  contents: read

jobs:
  test_and_check_version:
    name: Test and Check Version
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check out base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: main

      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK dependencies
        working-directory: ./pr/overmind
        run: uv sync --frozen --all-groups

      - name: Run SDK tests
        working-directory: ./pr/overmind
        env:
          OVERMIND_API_KEY: ${{ secrets.OVERMIND_API_KEY }}
        run: uv run pytest --ignore=tests/test_spans.py

      - name: Check for SDK version increment
        id: check_version
        run: |
          set -euo pipefail
          if [ ! -f main/overmind/pyproject.toml ]; then
            echo "No overmind/ package on base branch — skip version increment check."
            exit 0
          fi
          if [ ! -f pr/overmind/pyproject.toml ]; then
            echo "PR removed overmind/pyproject.toml"
            exit 1
          fi

          pip install toml-cli

          main_version=$(toml get --toml-path main/overmind/pyproject.toml project.version)
          pr_version=$(toml get --toml-path pr/overmind/pyproject.toml project.version)
          echo "Version on base (${{ github.base_ref }}): $main_version"
          echo "Version on PR branch: $pr_version"

          if [ "$main_version" = "$pr_version" ]; then
            echo "SDK version has not been incremented from base."
            exit 1
          fi

          if [ "$(printf '%s\n' "$main_version" "$pr_version" | sort -V | head -n1)" != "$main_version" ]; then
            echo "PR SDK version ($pr_version) is not greater than base ($main_version)."
            exit 1
          fi

          echo "Version check passed!"
