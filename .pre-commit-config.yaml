exclude: "^frontend/src/openapi/|^overbae/migrations/"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: "uv.lock$|overbae/services/workshop/assets/"
      - id: check-json
        exclude: "frontend/tsconfig.json"
      - id: check-toml
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-black
          - mdformat-frontmatter

  - repo: local
    hooks:
      - id: ruff
        name: ruff check --fix && ruff format
        entry: bash -c 'uv run ruff check --fix "$@" && uv run ruff format "$@"' --
        language: system
        types_or: [python, pyi]
      - id: biome
        name: biome check --write
        entry: bash -c 'cd frontend && bun run biome check --write "${@#frontend/}"' --
        language: system
        files: "^frontend/"
        types_or: [ts, tsx, javascript, jsx, json, css]
