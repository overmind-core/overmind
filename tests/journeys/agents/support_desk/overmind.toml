base-url = "https://api.overmindlab.ai"
project-id = ""
project-name = ""
repo_summary = ""
trace-provider = "overmind"
version = "0.2.1"

[capabilities.triage]
slug = "triage"
name = "Triage"
description = "Sorts a support ticket into refund, shipping or other."
entrypoint_fn = "support_desk.agent.triage"
model = "openai/gpt-4.1-mini"
source_path = "support_desk/agent.py"
system_prompt = "You triage customer support tickets. Reply with exactly one word: refund, shipping or other."

[capabilities.triage.capability_card]
task = "Classify a support ticket as refund, shipping or other."

[capabilities.answer]
slug = "answer"
name = "Answer"
description = "Replies to the customer, looking up orders when named."
entrypoint_fn = "support_desk.agent.answer"
model = "openai/gpt-4.1-mini"
source_path = "support_desk/agent.py"
system_prompt = "You are a support agent. Answer the customer in two sentences. Use lookup_order when the ticket names an order."
tools_summary = "lookup_order(order_id): fetch an order"

[capabilities.answer.capability_card]
task = "Answer a support ticket in two sentences, quoting the order id and status when an order is named."
